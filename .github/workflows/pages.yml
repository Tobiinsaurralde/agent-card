#  Publica el sitio en GitHub Pages en cada push a main.
#
#  El sitio es estático: la landing, el panel y el simulador corren enteros en el
#  browser sobre el motor de policy real con un emisor mock. No hay backend que
#  desplegar y no hay secretos acá adentro — lo único que se inyecta es la URL
#  pública del formulario de waitlist, que es pública por definición.
name: pages

on:
  push:
    branches: [main]
  # Para poder publicar a mano sin tener que empujar un commit vacío.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si entran dos pushes seguidos, que gane el último. No se cancela el que está
# publicando: dejar Pages a medio actualizar es peor que esperar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Sin esto, un test colgado se lleva las 6 horas que da GitHub por defecto.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Que el sitio compile no alcanza: si la policy está rota, el simulador
      # miente y es justo lo que la página promete que no hace.
      - run: npx tsc --noEmit

      # `--test-timeout` es lo que convierte un cuelgue en una falla que dice
      # qué test fue. En serie y con reporter `spec` para que el log quede
      # legible: en paralelo, el que se cuelga se pierde entre los demás.
      - name: Tests
        timeout-minutes: 5
        run: >
          node --import tsx --test
          --test-reporter=spec
          --test-concurrency=1
          --test-timeout=60000
          test/*.test.ts

      - name: Build
        env:
          # Dominio propio (konextech.xyz): el sitio vive en la raíz. Si volvemos a
          # servirlo desde /<repo>/ en github.io, esto tiene que ser /repo/.
          SITE_BASE: /
          VITE_WAITLIST_ENDPOINT: ${{ vars.WAITLIST_ENDPOINT }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
